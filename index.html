<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef4ff">
<meta name="description" content="给小朋友的 10 以内数的分解与凑十法动画练习，随机出题，边看边答。">
<title>十以内分与合 · 凑十乐园</title>
<style>
:root{
  --ink:#233450; --muted:#71829c; --line:#dce7f8; --card:#ffffff;
  --blue:#4b9bff; --blue-d:#2c78da; --orange:#ffb43c; --orange-d:#e58a10;
  --green:#3ecf9a; --green-d:#1fa574; --purple:#a68bff; --yellow:#ffd45e;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh; color:var(--ink);
  background:radial-gradient(1100px 600px at 10% -10%,#dceaff 0%,transparent 60%),
             radial-gradient(900px 600px at 100% 0%,#ffe9d5 0%,transparent 55%),
             radial-gradient(900px 700px at 50% 110%,#ddf8ec 0%,transparent 60%),#f6f9ff;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,-apple-system,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.ico{width:22px;height:22px;fill:currentColor;flex:none;vertical-align:-5px}
.app{max-width:820px;margin:0 auto;padding:18px 16px 44px}

/* ---------- 顶部 ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:52px;height:52px;border-radius:17px;background:linear-gradient(145deg,#5aa9ff,#8f7bff);
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px #4b7fe033;flex:none}
.brand-mark svg{width:30px;height:30px;fill:#fff}
h1{font-size:clamp(19px,4.4vw,27px);margin:0;letter-spacing:.5px}
.brand p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.top-right{display:flex;align-items:center;gap:9px}
.stars{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);
  border-radius:999px;padding:8px 14px;font-weight:800;font-size:17px;box-shadow:0 4px 12px #2b4b7a0d}
.stars svg{width:20px;height:20px;fill:#ffbf2f}
.icon-btn{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:#fff;color:var(--ink);
  border-radius:999px;padding:8px 13px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px #2b4b7a0d}
.icon-btn.off{color:#a6b2c6}
.icon-btn:active{transform:translateY(1px)}
.set-toggle{display:none;align-items:center;gap:5px;padding:5px 11px;font-size:13px}
.set-toggle .ico{width:16px;height:16px}

/* ---------- 模式与设置 ---------- */
.tabs{display:flex;gap:6px;background:#fff;border:2px solid var(--line);border-radius:20px;padding:6px;
  box-shadow:0 8px 22px #2b4b7a0f}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:transparent;
  color:var(--muted);font-size:clamp(14px,3.4vw,17px);font-weight:800;padding:12px 6px;border-radius:15px;cursor:pointer;
  font-family:inherit;transition:background .2s,color .2s,transform .2s}
.tab .ico{width:20px;height:20px}
.tab.active{background:linear-gradient(135deg,#4b9bff,#7d8dff);color:#fff;box-shadow:0 6px 14px #4b7fe044}
.tab:not(.active):hover{background:#f1f6ff;color:var(--ink)}
.settings{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 2px 10px;font-size:14px}
.set-label{color:var(--muted);font-weight:700}
.seg{display:flex;gap:4px;background:#eaf1ff;border-radius:12px;padding:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:#5c6f8e;font-weight:700;font-size:13px;padding:7px 11px;
  border-radius:9px;cursor:pointer;font-family:inherit;white-space:nowrap}
.seg button.on{background:#fff;color:#2c6fd6;box-shadow:0 2px 7px #2b4b7a1c}
.toggle{display:flex;align-items:center;gap:7px;margin-left:auto;color:var(--muted);font-weight:700;cursor:pointer;white-space:nowrap}
.toggle input{width:18px;height:18px;accent-color:#4b9bff;cursor:pointer}

/* ---------- 舞台 ---------- */
.stage-wrap{position:relative;width:100%;min-height:300px;overflow:hidden}
.stage{position:absolute;top:0;left:0;width:720px;height:420px;transform-origin:top left;
  background:linear-gradient(180deg,#fff,#fbfdff);border:3px solid #dce8fb;border-radius:26px;
  box-shadow:0 14px 34px #2b4b7a18;overflow:hidden}
.stage-title{position:absolute;left:20px;right:20px;top:12px;height:34px;line-height:34px;text-align:center;
  font-size:22px;font-weight:800;color:#3a5074}
.stage-label{position:absolute;text-align:center;font-size:15px;font-weight:800;color:#7b8ca8}
#frameLabel{left:56px;top:86px;width:318px}
#trayLabel{left:424px;top:86px;width:250px;color:#d78216}
#poolLabel{left:90px;top:286px;width:540px;color:#5b7095;font-size:15px}

.ten-frame{position:absolute;left:56px;top:118px;width:318px;height:130px;border:4px solid #afc7ee;
  border-radius:18px;background:#f4f9ff;padding:8px;display:none;
  grid-template-columns:repeat(5,54px);grid-template-rows:repeat(2,54px);gap:6px;z-index:2}
.cell{border:2px dashed #c9dbf6;border-radius:12px;background:#fff}
.cell.need{background:#fff4d6;border-color:#f2b53c;animation:cellGlow 1.1s ease-in-out infinite}
@keyframes cellGlow{50%{background:#ffe6a8;box-shadow:inset 0 0 0 3px #ffd775}}
.ten-badge{position:absolute;left:56px;top:118px;width:318px;height:130px;border-radius:20px;display:none;
  align-items:center;justify-content:center;font-size:74px;font-weight:900;color:#fff;z-index:7;
  background:linear-gradient(135deg,#42d6a0,#1fa574);box-shadow:0 10px 22px #1fa57455;animation:badgePop .55s ease-out}
@keyframes badgePop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}

.tray{position:absolute;left:424px;top:112px;width:250px;height:200px;border:3px dashed #f6c979;
  border-radius:20px;background:#fffaf0;display:none;z-index:1}
.basket{position:absolute;top:140px;width:290px;height:140px;border-radius:22px;display:none;z-index:1}
.basket.left{left:40px;border:3px dashed #a9cdff;background:#f2f8ff}
.basket.right{left:390px;border:3px dashed #ffd08a;background:#fff8ed}
.basket-label{position:absolute;left:0;right:0;top:8px;text-align:center;font-size:16px;font-weight:800;color:#4d7fc0}
.basket.right .basket-label{color:#d78216}
.pool{position:absolute;left:90px;top:56px;width:540px;height:56px;border:3px dashed #cfdcf2;
  border-radius:18px;background:#fafdff;display:none;transition:opacity .4s}
.pool.empty{opacity:.28}

.balls{position:absolute;inset:0;z-index:5;pointer-events:none}
.ball{position:absolute;left:0;top:0;width:40px;height:40px;border-radius:50%;opacity:0;
  background:radial-gradient(circle at 32% 26%,#ffffffcc 0%,#ffffff00 55%),var(--c,#4b9bff);
  border:2px solid var(--bd,#2c78da);box-shadow:0 5px 0 var(--sd,#2c78da),0 9px 14px #23345026;
  will-change:transform}
.ball.blue{--c:#63aeff;--bd:#3b87e0;--sd:#2f74cb}
.ball.orange{--c:#ffc35b;--bd:#f0a127;--sd:#dd8c12}
.ball.green{--c:#5cdda9;--bd:#2ec28c;--sd:#1da472}
.ball.purple{--c:#b9a4ff;--bd:#9378f0;--sd:#7d61de}
.ball.pulse{animation:glow .8s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 5px 0 var(--sd),0 0 0 0 #ffd45e00}50%{box-shadow:0 5px 0 var(--sd),0 0 0 10px #ffd45e88}}

.eq{position:absolute;left:20px;right:20px;top:318px;height:62px;display:flex;align-items:center;
  justify-content:center;gap:9px;z-index:3}
.eq-item{display:inline-flex;align-items:center;justify-content:center;flex:none}
.eq-item.num{min-width:52px;height:52px;padding:0 7px;border-radius:14px;font-size:31px;font-weight:900;
  background:#eaf2ff;border:3px solid #c9dcfb;color:#2a5ea8}
.eq-item.num.orange{background:#fff2d8;border-color:#f8cf83;color:#c9800d}
.eq-item.num.green{background:#ddf8ec;border-color:#93e5c2;color:#11875c}
.eq-item.num.purple{background:#f0eaff;border-color:#d3c2ff;color:#7053cc}
.eq-item.num.unknown{background:#fff0c2;border-color:#f5b73b;color:#d98b00;animation:bob 1.2s ease-in-out infinite}
.eq-item.num.hot{animation:pop .65s ease-out}
.eq-item.op{min-width:26px;font-size:29px;font-weight:900;color:#8494b0}
.eq.compact{gap:5px}
.eq.compact .eq-item.num{min-width:38px;height:44px;font-size:23px;border-width:2px;border-radius:11px;padding:0 4px}
.eq.compact .eq-item.op{min-width:20px;font-size:23px}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes pop{0%{transform:scale(.5)}65%{transform:scale(1.18)}100%{transform:scale(1)}}
.hint-line{position:absolute;left:20px;right:20px;top:386px;height:26px;line-height:26px;text-align:center;
  font-size:16px;font-weight:700;color:#7d8da8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 板书式凑十（练习册分合图） ---------- */
.board{position:absolute;inset:0;display:none;z-index:2}
.board-svg{position:absolute;left:0;top:0;width:720px;height:320px;pointer-events:none}
.bl{fill:none;stroke:#c7d6ee;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;transition:stroke .4s,stroke-width .4s}
.bl.lit{stroke:#f0a127;stroke-width:4;animation:lineGlow .55s ease}
.bl.hot.lit{stroke:#2ec28c}
.bl.cool.lit{stroke:#8f7bff}
.bl-plus{font-size:22px;font-weight:900;fill:#6b7f9e}
@keyframes lineGlow{0%{stroke-width:3}50%{stroke-width:6}100%{stroke-width:4}}
.bn{position:absolute;display:flex;align-items:center;justify-content:center;font-weight:900}
.be-num{top:26px;width:64px;height:62px;font-size:36px;border-radius:16px;background:#eaf2ff;border:3px solid #c9dcfb;color:#2a5ea8}
.be-num.split{background:#fff2d8;border-color:#f8cf83;color:#c9800d;animation:bob 1.4s ease-in-out infinite}
.be-op{top:26px;width:34px;height:62px;font-size:30px;color:#8494b0}
.be-sum{top:26px;width:80px;height:62px;font-size:34px;border-radius:16px;background:#fff0c2;border:3px dashed #f5b73b;color:#d98b00}
.be-sum.done{background:#ddf8ec;border:3px solid #93e5c2;color:#11875c;animation:pop .6s ease-out}
.bx{width:76px;height:56px;top:150px;border:3px dashed #c9d8ef;border-radius:14px;background:#fff;font-size:30px;color:#2a5ea8}
.bx.need{border-color:#f4bb55}
.bx.rest{border-color:#b6a4f2}
.bx.filled{border-style:solid;animation:pop .55s ease-out}
.bx.need.filled{background:#fff2d8;color:#c9800d}
.bx.rest.filled{background:#f0eaff;color:#7053cc}
.ten-chip{width:66px;height:44px;top:236px;border-radius:12px;background:#ddf8ec;border:3px solid #93e5c2;color:#11875c;font-size:27px;opacity:1;transform:scale(1)}
.ten-chip.flash{animation:tenFlash .6s ease-out}
@keyframes tenFlash{0%{transform:scale(.6);opacity:.4}60%{transform:scale(1.18)}100%{transform:scale(1)}}

/* ---------- 板书上的「小教练」提示与当前焦点 ---------- */
.board-coach{position:absolute;left:512px;top:88px;width:184px;padding:11px 12px;
  border-radius:16px;background:#fff8e5;border:2px solid #f7d488;color:#9a6508;
  font-size:15px;font-weight:800;line-height:1.5;box-shadow:0 6px 16px #d9a93a22}
.board-coach b{color:#e07d0d;font-size:18px}
.board-coach::before{content:'小教练';display:block;font-size:11px;font-weight:900;
  letter-spacing:2px;color:#c08a2c;margin-bottom:3px}
.board-coach.done{background:#e9fbf2;border-color:#8de0bb;color:#12875c}
.board-coach.done b{color:#0d8a5b}
.bn.focus{outline:3px solid #ffc94d;outline-offset:2px}
.bn.focus::after{content:'';position:absolute;inset:-8px;border-radius:inherit;
  border:3px solid #ffd45e;pointer-events:none;animation:focusBreath 1.4s ease-in-out infinite}
@keyframes focusBreath{0%,100%{opacity:.25;transform:scale(.97)}50%{opacity:.85;transform:scale(1.03)}}

/* ---------- 答题区 ---------- */
.question{margin-top:14px;background:#fff;border:2px solid var(--line);border-radius:22px;padding:16px;
  box-shadow:0 10px 26px #2b4b7a10}
.q-text{text-align:center;font-size:clamp(17px,3.8vw,21px);font-weight:800;line-height:1.5;min-height:32px}
.options{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.opt{border:3px solid #d7e4f8;background:#f7fbff;color:#2f4d7d;border-radius:18px;height:66px;
  font-size:29px;font-weight:900;cursor:pointer;font-family:inherit;transition:transform .15s,background .15s}
.opt:hover:not(:disabled){transform:translateY(-3px);background:#e9f3ff;border-color:#8fbcff}
.opt:disabled{cursor:default}
.opt.correct{background:#dcf8ea;border-color:#39c98f;color:#0d8a5b;transform:scale(1.04)}
.opt.wrong{background:#ffe8e8;border-color:#ff9a9a;color:#d44848;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{text-align:center;min-height:30px;margin-top:10px;font-size:17px;font-weight:800;color:var(--muted)}
.feedback.good{color:#149a68}
.feedback.tip{color:#b8790d;font-size:15px}

/* ---------- 做题顺序引导条（板书模式） ---------- */
.steps{display:none;gap:6px;align-items:stretch;margin:0 0 10px}
body.mode-board .steps{display:flex}
.step{flex:1;min-width:0;display:flex;align-items:center;gap:7px;padding:5px 8px;
  border-radius:12px;background:#f2f6fd;border:2px solid #e3ebf9;color:#8494b0;
  transition:background .3s,border-color .3s,color .3s,transform .3s}
.step-no{width:22px;height:22px;flex:none;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:900;background:#dfe8f7;color:#8494b0}
.step-body{min-width:0;display:flex;flex-direction:column;line-height:1.15}
.step-body b{font-size:13px;font-weight:900;white-space:nowrap}
.step-body small{font-size:11px;font-weight:700;white-space:nowrap;opacity:.85}
.step.active{background:#fff3d6;border-color:#f5b73b;color:#a86a05;transform:translateY(-1px);
  animation:stepPulse 1.8s ease-in-out infinite}
.step.active .step-no{background:#f7a928;color:#fff}
.step.done{background:#e4f8ee;border-color:#8de0bb;color:#12875c}
.step.done .step-no{background:#39c98f;color:#fff}
@keyframes stepPulse{50%{box-shadow:0 4px 16px #f5b73b55}}

.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.btn{flex:1 1 150px;display:flex;align-items:center;justify-content:center;gap:7px;min-height:52px;
  border:2px solid var(--line);border-radius:16px;background:#fff;color:#40577d;font-size:15px;font-weight:800;
  cursor:pointer;font-family:inherit;box-shadow:0 5px 14px #2b4b7a0c;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,#42d39d,#22ae7d);color:#fff;border-color:transparent}
.btn.warm{background:linear-gradient(135deg,#ffc45e,#f79c2c);color:#fff;border-color:transparent}
.btn:disabled{opacity:.55;cursor:default;transform:none}

.rhyme{margin-top:16px;border-radius:20px;padding:15px 18px;text-align:center;font-size:clamp(15px,3.5vw,18px);
  font-weight:800;letter-spacing:1px;color:#3c5f92;background:linear-gradient(100deg,#e9f2ff,#f3ecff 55%,#fff2df);
  border:2px solid #e2e9fb}
.rhyme small{display:block;margin-top:6px;font-size:13px;font-weight:600;letter-spacing:0;color:#7e8da8}
.cheatsheet{margin-top:16px;background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px}
.cheatsheet h2{margin:0 0 4px;font-size:16px;color:#3c5276}
.cheatsheet p{margin:0 0 12px;font-size:13px;color:var(--muted)}
.cs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cs-grid button{border:2px solid #e0e9f8;background:#f8fbff;border-radius:12px;padding:10px 4px;font-size:15px;
  font-weight:800;color:#3d628f;cursor:pointer;font-family:inherit}
.cs-grid button:hover{background:#eaf3ff;border-color:#9dc2f7}
footer{text-align:center;margin-top:20px;font-size:12px;color:#9aa8bd;line-height:1.7}

/* ---------- 板书模式：紧凑舞台（320px 高，比通用舞台省 100px） ---------- */
body.mode-board .stage-wrap{min-height:0}
body.mode-board .stage{height:320px}
body.mode-board .be-num{top:8px;height:54px;font-size:32px;border-radius:14px}
body.mode-board .be-op{top:8px;height:54px;font-size:28px}
body.mode-board .be-sum{top:8px;height:54px;font-size:30px;border-radius:14px}
body.mode-board .bx{top:114px;height:50px;font-size:28px}
body.mode-board .ten-chip{top:178px;height:38px;font-size:24px;border-radius:11px}
body.mode-board .eq{top:244px;height:46px;gap:5px}
body.mode-board .eq-item.num{min-width:40px;height:40px;font-size:22px;border-width:2px;border-radius:11px;padding:0 4px}
body.mode-board .eq-item.op{min-width:20px;font-size:22px}
body.mode-board .hint-line{top:290px;height:24px;line-height:24px;font-size:13px}
body.mode-board .bl-plus{font-size:20px}

/* ---------- Pad / 桌面：板书模式一屏排布，无需滚动 ---------- */
@media (min-width:700px){
  body.mode-board{height:100vh;height:100dvh;overflow:hidden}
  body.mode-board .app{max-width:1200px;height:100vh;height:100dvh;padding:8px 16px 10px;
    display:flex;flex-direction:column;gap:8px;overflow:hidden}
  body.mode-board .top{margin:0;flex:none;flex-wrap:nowrap}
  body.mode-board .brand-mark{width:38px;height:38px;border-radius:12px}
  body.mode-board .brand-mark svg{width:22px;height:22px}
  body.mode-board h1{font-size:19px}
  body.mode-board .brand p{display:none}
  body.mode-board .stars{padding:5px 12px;font-size:15px}
  body.mode-board .icon-btn{padding:5px 11px;font-size:13px}
  body.mode-board .tabs{padding:4px;flex:none;border-radius:15px}
  body.mode-board .tab{padding:8px 6px;font-size:15px;border-radius:11px}
  body.mode-board .set-toggle{display:flex}
  body.mode-board .settings{display:none;margin:0;flex:none;gap:8px;flex-wrap:nowrap}
  body.mode-board.set-open .settings{display:flex}
  /* 精简：小教练气泡≈题目、口诀条≈三步条、舞台底部版式说明——单屏时隐藏重复文字 */
  body.mode-board .board-coach{display:none}
  body.mode-board .rhyme{display:none}
  body.mode-board .hint-line{display:none}
  body.mode-board .step-body small{display:none}
  body.mode-board .set-label{font-size:13px}
  body.mode-board .seg button{padding:5px 9px;font-size:12px}
  body.mode-board .toggle{font-size:13px}
  body.mode-board .stage-wrap{min-height:0;overflow:hidden}
  body.mode-board .question{margin:0;flex:none;display:grid;
    grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto auto;
    column-gap:14px;row-gap:3px;align-items:center;padding:8px 14px;border-radius:16px}
  body.mode-board .steps{grid-area:1/1;margin:0}
  body.mode-board .step{padding:4px 7px}
  body.mode-board .q-text{grid-area:2/1;text-align:left;font-size:17px;line-height:1.3;min-height:0}
  body.mode-board .feedback{grid-area:3/1;margin:0;min-height:20px;font-size:14px;text-align:left}
  body.mode-board .options{grid-area:1/2/4/3;display:grid;grid-template-columns:repeat(4,72px);
    gap:9px;margin:0}
  body.mode-board .opt{width:72px;height:64px;font-size:28px;border-radius:15px}
  body.mode-board .controls{margin:0;flex:none;gap:8px;flex-wrap:nowrap}
  body.mode-board .btn{min-height:44px;flex:1 1 0;font-size:14px;border-radius:13px}
  body.mode-board .btn .ico{width:18px;height:18px}
  body.mode-board .rhyme{margin:0;flex:none;padding:8px 14px;font-size:14px;border-radius:14px}
  body.mode-board .rhyme small{display:inline;margin:0 0 0 8px;font-size:12px}
  body.mode-board .cheatsheet{display:none}
}

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var rand = function(a,b){ return a + Math.floor(Math.random()*(b-a+1)); };
function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr;
}
var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var DUR = REDUCED ? 1 : 620;

var S = {
  mode:'split', splitLevel:'mix', tenLevel:'mix', boardLevel:'mix', boardLayout:'mix', sound:true, autoNext:false,
  star:0, combo:0, token:0, timers:[], demo:false, demoId:0, problem:null
};

/* ---------- 定时与异步 ---------- */
function later(fn,ms){ var t=setTimeout(fn,ms); S.timers.push(t); return t; }
function wait(ms){ return new Promise(function(r){ var t=setTimeout(r,ms); S.timers.push(t); }); }
function bump(){
  S.token++;
  S.timers.forEach(clearTimeout);
  S.timers=[];
  S.demo=false; S.demoId++;
  return S.token;
}

/* ---------- 声音 ---------- */
var actx=null;
function beep(type){
  if(!S.sound) return;
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!actx) actx = new AC();
    if(actx.state === 'suspended') actx.resume();
    var seq = type==='right' ? [523,659,784] : type==='wrong' ? [280,220] : [660];
    for(var i=0;i<seq.length;i++){
      var o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime+i*0.085;
      o.type='sine'; o.frequency.value=seq[i];
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.15,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.21);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.22);
    }
  }catch(e){}
}
function speak(text){
  if(!S.sound || !text || !('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang='zh-CN'; u.rate=0.92; u.pitch=1.12; u.volume=0.9;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function confetti(n){
  var layer=$('confetti');
  var colors=['#ff6b8b','#ffc93c','#4ad6a2','#5aa9ff','#b78bff','#ff9b52'];
  for(var i=0;i<n;i++){
    var p=document.createElement('i');
    p.className='piece';
    p.style.left=(Math.random()*100)+'vw';
    p.style.background=colors[i%colors.length];
    p.style.animationDuration=(1.4+Math.random()*1.1)+'s';
    p.style.animationDelay=(Math.random()*0.5)+'s';
    p.style.opacity='0.9';
    layer.appendChild(p);
    (function(el){ setTimeout(function(){ el.remove(); },3200); })(p);
  }
}

/* ---------- 舞台坐标（逻辑画布 720 x 420） ---------- */
var P = {
  frame:function(i){ return {x:75+(i%5)*60, y:137+Math.floor(i/5)*60}; },
  tray:function(i){ return {x:440+(i%3)*74, y:156+Math.floor(i/3)*54}; },
  left:function(i){ return {x:56+(i%5)*54, y:186+Math.floor(i/5)*50}; },
  right:function(i){ return {x:406+(i%5)*54, y:186+Math.floor(i/5)*50}; },
  pool:function(i,n){ return {x:360-(n*48)/2+i*48, y:64}; }
};
var BALL_N=20, ballEls=[];
function initBalls(){
  for(var i=0;i<BALL_N;i++){
    var d=document.createElement('div');
    d.className='ball'; d.style.opacity='0'; d.style.transform='translate(0px,0px) scale(0)';
    $('balls').appendChild(d); ballEls.push(d);
  }
}
function hideAllBalls(){
  for(var i=0;i<BALL_N;i++){
    var b=ballEls[i];
    b.style.transition='none'; b.style.opacity='0';
    b.style.transform='translate(0px,0px) scale(0)';
    b.className='ball';
  }
}
function setBall(i,pos,color){
  var b=ballEls[i];
  b.style.transition='none';
  b.className='ball '+(color||'blue');
  b.style.opacity='1';
  b.style.transform='translate('+pos.x+'px,'+pos.y+'px) scale(1)';
  void b.offsetWidth;
}
function moveBall(i,pos,delay,ms){
  var b=ballEls[i];
  b.style.transition='transform '+(ms===undefined?DUR:ms)+'ms cubic-bezier(.34,1.25,.5,1) '+(delay||0)+'ms';
  b.style.transform='translate('+pos.x+'px,'+pos.y+'px) scale(1)';
}
function recolor(i,color){ ballEls[i].className='ball '+color; }
function fadeBall(i){
  ballEls[i].style.transition='none'; ballEls[i].style.opacity='0';
}
function pulse(from,to){
  for(var i=from;i<to;i++) ballEls[i].classList.add('pulse');
  later(function(){ for(var j=from;j<to;j++) ballEls[j].classList.remove('pulse'); },1700);
}
function stageView(which){
  var ten = which==='ten', split = which==='split';
  $('tenFrame').style.display = ten?'grid':'none';
  $('tray').style.display = ten?'block':'none';
  $('frameLabel').style.display = ten?'block':'none';
  $('trayLabel').style.display = ten?'block':'none';
  $('tenBadge').style.display='none';
  $('basketL').style.display = split?'block':'none';
  $('basketR').style.display = split?'block':'none';
  $('pool').style.display = split?'block':'none';
  $('poolLabel').style.display = split?'block':'none';
  if(split) $('pool').classList.remove('empty');
  $('board').style.display = which==='board'?'block':'none';
  if(which==='board') $('stageTitle').textContent='';
}
function buildFrameCells(){
  for(var i=0;i<10;i++){
    var c=document.createElement('div'); c.className='cell'; c.dataset.i=String(i);
    $('tenFrame').appendChild(c);
  }
}
function lightCells(from,to,cls){
  var cells=$('tenFrame').children;
  for(var i=0;i<cells.length;i++) cells[i].classList.toggle(cls,i>=from&&i<to);
}
function fitStage(){
  var wrap=$('stageWrap'), stage=$('stage');
  var board=S.mode==='board';
  var wide=window.innerWidth>=700;      /* 与 CSS 单屏断点一致 */
  var oneScreen=board&&wide;
  var portrait=window.innerHeight>window.innerWidth;   /* 竖屏：内容聚拢，不占满 flex 高度 */
  var H=board?320:420;                  /* 板书舞台压缩到 320 */
  var w=wrap.clientWidth || (window.innerWidth ? window.innerWidth-32 : 720);
  /* 横屏：舞台占 flex 剩余高度按高度放大；竖屏/窄屏：按宽度缩放、容器贴合内容 */
  var flexH=oneScreen&&!portrait;
  var h=flexH?(wrap.clientHeight||H):H;
  var maxScale=oneScreen?1.5:1;    /* P40 等宽屏空间富余时把板书等比放大，方便小孩看和点 */
  /* 竖屏：舞台按容器宽度满幅放大(忽略高度约束)，尽量利用宽度、放大字号 */
  var scale=Math.min(maxScale,w/720,flexH?h/H:9);
  if(!(scale>0)) scale=1;
  stage.style.height=H+'px';
  stage.style.transform='scale('+scale+')';
  stage.style.left=Math.max(0,Math.round((w-720*scale)/2))+'px';
  stage.style.top=flexH?Math.max(0,Math.round((h-H*scale)/2))+'px':'0px';
  wrap.style.height=flexH?'':Math.round(H*scale)+'px';
}

/* ---------- 文本与算式 ---------- */
function num(t,c){ return {t:String(t), cls:'num '+(c||'blue')}; }
function op(t){ return {t:String(t), cls:'op'}; }
function setEq(parts,compact){
  var html='';
  for(var i=0;i<parts.length;i++) html += '<span class="eq-item '+parts[i].cls+'">'+parts[i].t+'</span>';
  $('eq').className='eq'+(compact?' compact':'');
  $('eq').innerHTML=html;
}
function setTitle(t){ $('stageTitle').textContent=t; }
function setHint(t){ $('hintLine').textContent=t; }
function optionsFor(ans,lo,hi){
  var set={}; set[ans]=true; var count=1;
  var delta=[1,-1,2,-2,3,-3,4,-4];
  for(var i=0;i<delta.length&&count<4;i++){
    var v=ans+delta[i];
    if(v>=lo&&v<=hi&&!set[v]){ set[v]=true; count++; }
  }
  var guard=0;
  while(count<4&&guard++<100){
    var r=rand(lo,hi);
    if(!set[r]){ set[r]=true; count++; }
  }
  return shuffle(Object.keys(set).map(Number));
}
function ask(text,opts,correct,onRight,speakText){
  var p=S.problem;
  if(p) p.currentAnswer=correct;
  $('qText').textContent=text;
  $('feedback').textContent=''; $('feedback').className='feedback';
  var box=$('options'); box.innerHTML='';
  opts.forEach(function(v){
    var b=document.createElement('button');
    b.type='button'; b.className='opt'; b.textContent=String(v);
    b.onclick=function(){
      if(b.disabled) return;
      if(v===correct){
        Array.prototype.forEach.call(box.children,function(c){ c.disabled=true; });
        b.classList.add('correct');
        onRight();
      }else{
        b.classList.add('wrong');
        setTimeout(function(){ b.classList.remove('wrong'); },420);
        $('feedback').textContent='再数一数，你可以的！';
        $('feedback').className='feedback';
        S.combo=0; beep('wrong');
      }
    };
    box.appendChild(b);
  });

function celebrate(msg,next,big){

/* ================= 模式一：数的分解 ================= */
function pickN(){
  if(S.splitLevel==='ten') return 10;
  if(S.splitLevel==='easy') return rand(2,5);
  if(S.splitLevel==='mid') return rand(6,9);
  return Math.random()<0.45 ? 10 : rand(3,10);
}
function splitEq(p,solved){
  var n=p.n,k=p.k,m=p.m;
  if(p.type==='whole'){
    return [num(solved?n:'?',solved?'green':'unknown'),op('='),num(k,'blue'),op('+'),num(m,'orange')];
  }
  var left=p.hide==='left'?(solved?k:'?') : k;
  var right=p.hide==='right'?(solved?m:'?') : m;
  return [num(n,'purple'),op('='),
          num(left,left==='?'?'unknown':'blue'),op('+'),
          num(right,right==='?'?'unknown':'orange')];
}
function splitQuestion(p){
  if(p.type==='whole') return '左边 '+p.k+' 个，右边 '+p.m+' 个，合起来一共几个？';
  if(p.hide==='right') return '把 '+p.n+' 个圆片分成两堆，左边 '+p.k+' 个，右边有几个？';
  return '把 '+p.n+' 个圆片分成两堆，右边 '+p.m+' 个，左边有几个？';
}
function splitHint(p){
  if(p.type==='whole') return '把两堆连着数：先数 '+p.k+' 个，再往后数 '+p.m+' 个。';
  return '一共 '+p.n+' 个，去掉已知的 '+p.known+' 个，剩下的就是答案。';
}
function genSplit(forced){
  var tk=bump(); forced=forced||{};
  var n = forced.n!==undefined ? forced.n : pickN();
  var k = forced.k!==undefined ? forced.k : rand(1,n-1);
  var m = n-k;
  var type = forced.type || (Math.random()<0.72?'part':'whole');
  var hide = forced.hide || (Math.random()<0.5?'left':'right');
  var answer = type==='whole' ? n : (hide==='right'?m:k);
  var known = hide==='right'?k:m;
  var p={kind:'split',n:n,k:k,m:m,type:type,hide:hide,answer:answer,known:known,phase:'ask'};
  S.problem=p;

  stageView('split'); hideAllBalls(); lightCells(0,0,'need');
  $('pool').classList.toggle('empty',type==='whole');
  $('labelL').textContent = type==='whole' ? (k+' 个') : (hide==='left'?'? 个':(k+' 个'));
  $('labelR').textContent = type==='whole' ? (m+' 个') : (hide==='right'?'? 个':(m+' 个'));
  $('poolLabel').textContent = type==='whole' ? '两堆合起来是几个？' : ('一共 '+n+' 个圆片');
  setTitle(type==='whole' ? '把两堆合起来，数一数' : ('把 '+n+' 分成两堆'));
  setEq(splitEq(p,false));
  setHint(type==='whole'?'一个数，分两堆；分出去，合回来':'分与合是一对好朋友');
  animateSplit(tk,p);

  var q=splitQuestion(p);
  ask(q,optionsFor(answer,type==='whole'?2:1,10),answer,function(){
    p.phase='done';
    $('labelL').textContent=(type==='whole'?'原来 ':'')+k+' 个';
    $('labelR').textContent=(type==='whole'?'原来 ':'')+m+' 个';
    if(type==='whole') $('poolLabel').textContent='合起来是 '+n+' 个';
    setEq(splitEq(p,true));
    setHint(n+' 可以分成 '+k+' 和 '+m+'；'+k+' 和 '+m+' 合起来就是 '+n);
    setTitle('答对啦！'+n+' = '+k+' + '+m);
    celebrate('答对啦！',function(){ if(S.autoNext && !S.demo) genSplit(); },false);
  },q);
}
function animateSplit(tk,p){
  var n=p.n,k=p.k,m=p.m,i;
  if(p.type==='whole'){
    for(i=0;i<n;i++) setBall(i, i<k?P.left(i):P.right(i-k), i<k?'blue':'orange');
    wait(420).then(function(){
      if(tk!==S.token) return;
      $('pool').classList.remove('empty');
      $('labelL').textContent='原来 '+k+' 个';
      $('labelR').textContent='原来 '+m+' 个';
      for(var j=0;j<n;j++) moveBall(j,P.pool(j,n),j*55,DUR);
      later(function(){ for(var q=k;q<n;q++) recolor(q,'blue'); },420+DUR*0.75);
    });
  }else{
    for(i=0;i<n;i++) setBall(i,P.pool(i,n),i<k?'blue':'orange');
    wait(420).then(function(){
      if(tk!==S.token) return;
      $('pool').classList.add('empty');
      for(var j=0;j<n;j++) moveBall(j, j<k?P.left(j):P.right(j-k), j*55, DUR);
    });
  }
}

/* ================= 模式二：凑十法 ================= */
function pickAB(){
  if(S.tenLevel==='easy'){ var a1=rand(6,9); return {a:a1,b:rand(Math.max(2,11-a1),5)}; }
  if(S.tenLevel==='hard'){ var a2=rand(7,9); return {a:a2,b:rand(Math.max(2,11-a2),9)}; }
  var a3=rand(6,9); return {a:a3,b:rand(Math.max(2,11-a3),9)};
}
function genTen(forced){
  var tk=bump(); forced=forced||{};
  var ab = forced.a!==undefined ? {a:forced.a,b:forced.b} : pickAB();
  var a=ab.a,b=ab.b,need=10-a,rest=b-need,sum=a+b;
  var p={kind:'ten',a:a,b:b,need:need,rest:rest,sum:sum,step:0,phase:'ask'};
  S.problem=p;

  stageView('ten'); hideAllBalls(); lightCells(a,10,'need');
  for(var i=0;i<a;i++) setBall(i,P.frame(i),'blue');
  for(var j=0;j<b;j++) setBall(a+j,P.tray(j),'orange');
  $('frameLabel').textContent='十格阵里已有 '+a+' 个';
  $('trayLabel').textContent='小数 '+b+' 个';
  setTitle(a+' + '+b+' = ?');
  setEq([num(a,'blue'),op('+'),num(b,'orange'),op('='),num('?','unknown')]);
  setHint('看大数，拆小数，凑成十，加剩数');

  ask('第一步：'+a+' 再添几个就是 10？',optionsFor(need,1,5),need,function(){
    lightCells(0,0,'need');
    celebrate('对啦！'+a+' 差 '+need+' 个就满 10',function(){ tenBorrow(tk); },false);
  },'第一步，'+a+' 再添几个就是十');
}
function tenBorrow(tk){
  var p=S.problem;
  if(!p||p.kind!=='ten') return;
  var a=p.a,b=p.b,need=p.need,rest=p.rest,j;
  lightCells(0,0,'need');
  setTitle('从 '+b+' 里借 '+need+' 个，凑满十格阵');
  setEq([num(a,'blue'),op('+'),num(b,'orange'),op('='),num(a,'blue'),op('+'),num(need,'green'),op('+'),num(rest,'orange')],true);
  setHint(b+' 可以分成 '+need+' 和 '+rest);
  $('frameLabel').textContent='借 '+need+' 个，正好满 10';
  for(j=0;j<need;j++) moveBall(a+j,P.frame(a+j),j*100,DUR);
  for(j=need;j<b;j++) moveBall(a+j,P.tray(j-need),300+(j-need)*70,DUR);
  later(function(){ for(var q=0;q<need;q++) recolor(a+q,'green'); },300+DUR*0.8);
  wait(300+DUR+320).then(function(){
    if(tk!==S.token) return;
    p.step=1;
    $('trayLabel').textContent='把 '+b+' 拆成 '+need+' 和 ?';
    var q='第二步：'+b+' 拆走 '+need+' 个去凑十，还剩几个？';
    ask(q,optionsFor(rest,1,9),rest,function(){
      celebrate('没错！还剩 '+rest+' 个',function(){ tenFinish(); },false);
    },b+' 拆走 '+need+' 个，还剩几个');
  });
}
function tenFinish(){
  var p=S.problem;
  if(!p||p.kind!=='ten') return;
  var a=p.a,b=p.b,need=p.need,rest=p.rest,sum=p.sum;
  $('tenFrame').style.display='none';
  $('tenBadge').style.display='flex';
  for(var i=0;i<10;i++) fadeBall(i);
  $('trayLabel').textContent='还剩 '+rest+' 个';
  setTitle('凑成 10 啦！');
  setEq([num(10,'green'),op('+'),num(rest,'orange'),op('='),num('?','unknown')]);
  setHint('凑成十，加剩数');
  p.step=2;
  var q='第三步：10 + '+rest+' = ?';
  ask(q,optionsFor(sum,10,18),sum,function(){
    p.phase='done';
    setEq([num(a,'blue'),op('+'),num(b,'orange'),op('='),num(sum,'green hot')]);
    setHint('思路：'+a+'+'+b+' → '+a+'+'+need+'+'+rest+' → 10+'+rest+' = '+sum);
    setTitle('学会啦！凑十法');
    celebrate('太厉害了！'+a+' + '+b+' = '+sum,function(){ if(S.autoNext && !S.demo) genTen(); },true);
  },'十加 '+rest+' 等于几');
}

/* ================= 模式三：板书式分合图凑十 ================= */
function pickBoardAB(){
  var minSum=S.boardLevel==='hard'?15:11;
  var maxSum=S.boardLevel==='easy'?13:18;
  var a,b,guard=0;
  do{ a=rand(2,9); b=rand(2,9); guard++; }
  while((a+b<=10||a+b<minSum||a+b>maxSum)&&guard<300);
  return {a:a,b:b};
}
function resetBoardLines(){
  var els=$('boardSvg').querySelectorAll('.bl');
  for(var i=0;i<els.length;i++) els[i].classList.remove('lit');
  $('boardTen').classList.remove('flash');
}
/* 两种版式共用一套几何公式：人字顶点 = 被拆数中心，两框严格左右对称，
   括线起点 = 没拆数中心，10 徽章 = 括线中点，底线上连剩数框。互为镜像且完全对齐。 */
function boardGeometry(p){
  var second = p.target==='second';
  var splitCx = second?352:254;               /* 被拆的加数中心（beB / beA） */
  var keepCx  = second?254:352;               /* 没拆的加数中心 */
  var boxCx1  = splitCx-56, boxCx2 = splitCx+56;  /* 两个方框中心，相对顶点对称 */
  var needCx  = second?boxCx1:boxCx2;         /* 补数框：靠近没拆的数 */
  var restCx  = second?boxCx2:boxCx1;         /* 剩数框 */
  var tenCx   = Math.round((keepCx+needCx)/2);
  return {second:second,splitCx:splitCx,keepCx:keepCx,boxCx1:boxCx1,boxCx2:boxCx2,
          needCx:needCx,restCx:restCx,tenCx:tenCx};
}
function drawBoardSkeleton(p){
  var g=boardGeometry(p), second=g.second;
  $('beA').textContent=String(p.a);
  $('beB').textContent=String(p.b);
  $('beA').className='bn be-num'+(second?'':' split');
  $('beB').className='bn be-num'+(second?' split':'');
  $('beSum').textContent=''; $('beSum').className='bn be-sum';
  $('bxL').textContent=''; $('bxR').textContent='';
  $('bxL').className='bn bx '+(second?'need':'rest');
  $('bxR').className='bn bx '+(second?'rest':'need');
  $('bxL').style.left=(g.boxCx1-38)+'px';
  $('bxR').style.left=(g.boxCx2-38)+'px';
  $('boardTen').className='bn ten-chip';
  $('boardTen').style.left=(g.tenCx-33)+'px';
  $('blForkL').setAttribute('d','M '+g.splitCx+' 62 L '+g.boxCx1+' 112');
  $('blForkR').setAttribute('d','M '+g.splitCx+' 62 L '+g.boxCx2+' 112');
  $('blBrace').setAttribute('d','M '+g.keepCx+' 62 V 176 H '+g.needCx+' V 164');
  $('blBottom').setAttribute('d','M '+g.tenCx+' 218 V 240 H '+g.restCx+' V 164');
  $('blPlus1').setAttribute('x',String(Math.round(g.keepCx+(g.needCx-g.keepCx)*0.55)));
  $('blPlus1').setAttribute('y','170');
  $('blPlus2').setAttribute('x',String(Math.round((g.tenCx+g.restCx)/2)));
  $('blPlus2').setAttribute('y','234');
  resetBoardLines();
}
/* ---------- 三步顺序引导：让孩子知道「现在做哪一步、下一步做什么」 ---------- */
var BOARD_STEPS=[
  {name:'找朋友',tip:'谁和它凑成 10'},
  {name:'拆一拆',tip:'借走后剩几个'},
  {name:'加剩数',tip:'10 再往后数'}
];
function renderSteps(active){          /* active: 0/1/2 当前步，3 表示全部完成 */
  var h='';
  BOARD_STEPS.forEach(function(s,i){
    var cls=i<active?'done':(i===active?'active':'todo');
    h+='<div class="step '+cls+'"><span class="step-no">'+(i<active?'\u2713':(i+1))+'</span>'+
       '<span class="step-body"><b>'+s.name+'</b><small>'+s.tip+'</small></span></div>';
  });
  $('steps').innerHTML=h;
  $('steps').setAttribute('data-progress',String(Math.min(3,active)));
}
function setBoardFocus(step,p){
  var ids=['beA','beB','bxL','bxR','boardTen','beSum'];
  ids.forEach(function(id){ $(id).classList.remove('focus'); });
  var keep =p.target==='second'?'beA':'beB';
  var split=p.target==='second'?'beB':'beA';
  var needBox=p.target==='second'?'bxL':'bxR';
  var restBox=p.target==='second'?'bxR':'bxL';
  var f = step===0?[keep,needBox] : step===1?[split,restBox] : step===2?['boardTen','beSum'] : [];
  f.forEach(function(id){ $(id).classList.add('focus'); });
}
function boardCoach(step,p){
  var tag=$('boardCoach'), t;
  if(step===0) t='\u2460 先看 <b>'+p.Y+'</b><br>给它凑成 10，<br>还差几个？';
  else if(step===1) t='\u2461 把 <b>'+p.X+'</b> 拆两半<br>借走的填橙框，<br>剩下填紫框';
  else if(step===2) t='\u2462 凑成 <b>10</b> 啦！<br>再往后数 <b>'+p.rest+'</b> 个<br>就是答案';
  else t='\u2713 三步全对！<br><b>'+p.a+' + '+p.b+' = '+p.sum+'</b><br>再来一题吧';
  tag.innerHTML=t;
  tag.className='board-coach'+(step>=3?' done':' s'+step);
  setBoardFocus(step,p);
}

function genBoard(forced){
  var tk=bump(); forced=forced||{};
  var ab = forced.a!==undefined ? {a:forced.a,b:forced.b} : pickBoardAB();
  var a=ab.a,b=ab.b,sum=a+b;
  var target = forced.target || (S.boardLayout==='mix' ? (Math.random()<0.5?'second':'first') : S.boardLayout);
  var X=target==='second'?b:a, Y=target==='second'?a:b;
  var need=10-Y, rest=X-need;
  var p={kind:'board',a:a,b:b,sum:sum,target:target,X:X,Y:Y,need:need,rest:rest,step:0,phase:'ask'};
  S.problem=p;
  stageView('board'); hideAllBalls(); lightCells(0,0,'need');
  drawBoardSkeleton(p);
  setEq([num(a,'blue'),op('+'),num(b,'orange'),op('='),num('?','unknown')]);
  setHint(target==='second'?'拆第二个数，补第一个数凑成 10':'拆第一个数，补第二个数凑成 10');
  renderSteps(0); boardCoach(0,p);

    celebrate('对啦！'+Y+' 和 '+need+' 凑成 10 → 下一步：把 '+X+' 拆一拆',function(){ boardStep1(tk); },false);
  },q);
}
function boardStep1(tk){

function boardStep2(tk){

function boardFinal(){

          renderSteps(3); setBoardFocus(3,p); p.phase='done';
          say('\u505a\u5b8c\u5566\uff01'+p.a+' + '+p.b+' = '+p.sum+' \uff0c\u6362\u4e00\u9898\u4f60\u81ea\u5df1\u8bd5\u8bd5',
              '\u601d\u8def\uff1a'+p.a+'+'+p.b+' \u2192 '+p.Y+'+'+p.need+'=10 \u2192 10+'+p.rest+'='+p.sum);
          confetti(40); beep('right'); S.demo=false;
        },1700);
      },2100);
    },900);
  },200);
}

/* ================= 公共操作 ================= */
function newProblem(){
  if(S.mode==='split') genSplit();
  else if(S.mode==='board') genBoard();
  else genTen();
}
function repeatCurrent(){
  var p=S.problem;
  if(!p) return newProblem();
  if(p.kind==='split') genSplit({n:p.n,k:p.k,type:p.type,hide:p.hide});
  else if(p.kind==='board') genBoard({a:p.a,b:p.b,target:p.target});
  else genTen({a:p.a,b:p.b});
}
function showHint(){
  var p=S.problem; if(!p) return;
  var t='';
  if(p.kind==='split'){
    t=splitHint(p);
    if(p.type==='whole') pulse(0,p.n);
    else if(p.hide==='left') pulse(0,p.k);
    else pulse(p.k,p.n);
  }else if(p.kind==='board'){
    if(p.step===0) t='先看不用拆的 '+p.Y+'，给它凑成 10 还差 '+p.need+' 个，去 '+p.X+' 里借。';
    else if(p.step===1) t=p.X+' 借走 '+p.need+' 个，掰着手指数一数，还剩 '+p.rest+' 个。';
    else t='凑成 10 啦！10 再往后数 '+p.rest+' 个，就是 '+p.sum+'。';
  }else{
    if(p.step===0){ t='数一数，十格阵还空着 '+p.need+' 个格子，就要从 '+p.b+' 里借 '+p.need+' 个。'; lightCells(p.a,10,'need'); }
    else if(p.step===1){ t=p.b+' 拆走 '+p.need+' 个，剩下的是 '+p.rest+' 个。'; pulse(10,10+p.rest); }
    else { t='10 再往后数 '+p.rest+' 个，就是 '+p.sum+'。'; }
  }
  $('feedback').textContent='小提示：'+t;
  $('feedback').className='feedback tip';
  speak(t);
}
function autoDemo(){
  if(S.demo) return;
  var p=S.problem;
  if(!p || p.phase==='done' || $('options').querySelectorAll('button:not(:disabled)').length===0) newProblem();
  S.demo=true; var id=++S.demoId, tries=0;
  var step=function(){
    if(id!==S.demoId||!S.demo) return;
    var pr=S.problem;
    var btns=$('options').querySelectorAll('button:not(:disabled)');
    var target=null;
    for(var i=0;i<btns.length;i++){
      if(Number(btns[i].textContent)===pr.currentAnswer){ target=btns[i]; break; }
    }
    if(!target){
      if(pr.phase==='done' || ++tries>24){ S.demo=false; return; }
      later(step,350);
      return;
    }
    tries=0;
    target.click();
    later(step,1750);
  };
  step();
}
function switchMode(m){
  S.mode=m;
  document.body.classList.toggle('mode-board',m==='board');
  document.body.classList.remove('set-open');
  var tabs=document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++){
    var on=tabs[i].dataset.mode===m;
    tabs[i].classList.toggle('active',on);
    tabs[i].setAttribute('aria-selected',on?'true':'false');
  }
  $('cheatsheet').style.display = m==='split'?'block':'none';
  $('demoText').textContent = m==='board'?'看演示':'自动演示';
  if(m==='split'){
    $('rhyme').innerHTML='分与合口诀：一个数，分两堆；分出去，合回来<small>总数 = 左边 + 右边，知道两个数就能求出第三个</small>';
  }else if(m==='board'){
    $('rhyme').innerHTML='凑十儿歌：找朋友，拆一拆，凑成十，加剩数<small>按上面 ① ② ③ 三步做，方框里填拆出的两个数</small>';
  }else{
    $('rhyme').innerHTML='凑十法口诀：看大数，拆小数，凑成十，加剩数<small>例：8 + 5 = 8 + 2 + 3 = 10 + 3 = 13</small>';
  }
  renderSettings();
  bump();
  newProblem();
  fitStage();                 /* 单屏布局需要在模式切换后重新量一次 */
}
function renderSettings(){
  var levels, cur;
  if(S.mode==='split'){
    levels=[['mix','全部'],['easy','2~5'],['mid','6~9'],['ten','只练 10']];
    cur=S.splitLevel;
  }else if(S.mode==='board'){
    levels=[['mix','全部'],['easy','简单'],['hard','挑战']];
    cur=S.boardLevel;
  }else{
    levels=[['mix','全部'],['easy','简单'],['hard','挑战']];
    cur=S.tenLevel;
  }
  var html='';
  levels.forEach(function(l){ html+='<button type="button" data-lv="'+l[0]+'" class="'+(l[0]===cur?'on':'')+'">'+l[1]+'</button>'; });
  $('segLevel').innerHTML=html;
  var btns=$('segLevel').querySelectorAll('button');
  for(var i=0;i<btns.length;i++){
    btns[i].onclick=function(){
      var lv=this.dataset.lv;
      if(S.mode==='split') S.splitLevel=lv;
      else if(S.mode==='board') S.boardLevel=lv;
      else S.tenLevel=lv;
      renderSettings(); newProblem();
    };
  }
  var isBoard=S.mode==='board';
  $('layoutLabel').style.display=isBoard?'inline':'none';
  $('segLayout').style.display=isBoard?'flex':'none';
  if(isBoard){
    var ls=[['mix','两种版式'],['second','拆第二个数'],['first','拆第一个数']];
    var h='';
    ls.forEach(function(l){ h+='<button type="button" data-lo="'+l[0]+'" class="'+(l[0]===S.boardLayout?'on':'')+'">'+l[1]+'</button>'; });
    $('segLayout').innerHTML=h;
    var lbs=$('segLayout').querySelectorAll('button');
    for(var j=0;j<lbs.length;j++){
      lbs[j].onclick=function(){ S.boardLayout=this.dataset.lo; renderSettings(); newProblem(); };
    }
  }
}
function buildCheatsheet(){
  var html='';
  for(var i=1;i<=9;i++) html+='<button type="button" data-k="'+i+'">10 = '+i+' + '+(10-i)+'</button>';
  $('csGrid').innerHTML=html;
  var btns=$('csGrid').querySelectorAll('button');
  for(var j=0;j<btns.length;j++){
    btns[j].onclick=function(){
      if(S.mode!=='split') switchMode('split');
      genSplit({n:10,k:Number(this.dataset.k),type:'part',hide:'right'});
    };
  }
}
function bindEvents(){
  var tabs=document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++) tabs[i].onclick=function(){ switchMode(this.dataset.mode); };
  $('newBtn').onclick=function(){ bump(); newProblem(); };
  $('replayBtn').onclick=repeatCurrent;
  $('demoBtn').onclick=function(){ if(S.mode==='board') boardGuide(); else autoDemo(); };
  $('hintBtn').onclick=showHint;
  $('autoNext').onchange=function(){ S.autoNext=this.checked; };
  $('soundBtn').onclick=function(){
    S.sound=!S.sound;
    $('soundText').textContent=S.sound?'声音开':'声音关';
    $('soundIcon').setAttribute('href',S.sound?'#i-sound':'#i-mute');
    this.classList.toggle('off',!S.sound);
    if(S.sound) beep('right');
    else if('speechSynthesis' in window) window.speechSynthesis.cancel();
  };
  $('settingsToggle').onclick=function(){
    document.body.classList.toggle('set-open');
    fitStage();
  };
  window.addEventListener('resize',fitStage);
  window.addEventListener('orientationchange',function(){ setTimeout(fitStage,120); });
}

/* ---------- 启动 ---------- */
initBalls(); buildFrameCells(); buildCheatsheet(); bindEvents();
var startMode=new URLSearchParams(window.location.search).get('mode');
S.mode = (startMode==='ten'||startMode==='board'||startMode==='split')?startMode:'board';
switchMode(S.mode);
fitStage();
setTimeout(fitStage,80);
setTimeout(fitStage,300);
})();
</script>
